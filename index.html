<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Abandoned House</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
    color:white;
}

#game {
    width:100vw;
    height:100vh;
    position:relative;
    background:#0b0b0b;
}

#room {
    width:100%;
    height:100%;
    background:#111;
    filter:brightness(0.2);
    transition:0.2s;
}

#text {
    position:absolute;
    bottom:20px;
    left:20px;
    font-size:18px;
}

#door {
    position:absolute;
    right:10%;
    top:35%;
    width:120px;
    height:200px;
    background:#222;
    border:2px solid #555;
    cursor:pointer;
}

#flashlight {
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,200,0.9), rgba(0,0,0,0.95));
    pointer-events:none;
    display:none;
    mix-blend-mode:lighten;
}

#ghost {
    position:absolute;
    font-size:80px;
    display:none;
}
</style>

</head>
<body>

<div id="game">
    <div id="room"></div>
    <div id="door"></div>
    <div id="ghost">👻</div>
    <div id="flashlight"></div>
    <div id="text">Click to start</div>
</div>

<script>

let room = 1;
let flashlightOn = false;
let alive = true;

const text = document.getElementById("text");
const ghost = document.getElementById("ghost");
const flashlight = document.getElementById("flashlight");
const roomDiv = document.getElementById("room");

// start game
document.body.onclick = () => {
    text.innerHTML = "Find the exit...";
};

// move to next room
document.getElementById("door").onclick = () => {
    if(!alive) return;

    room++;
    text.innerHTML = "Room " + room;

    let chance = Math.random();

    if(chance < 0.4){
        spawnGhost();
    } else if(chance < 0.7){
        flicker();
    }
};

// ghost event
function spawnGhost(){
    ghost.style.display = "block";
    ghost.style.left = Math.random()*70 + "%";
    ghost.style.top = Math.random()*60 + "%";

    text.innerHTML = "Something is here...";

    setTimeout(() => {
        if(!flashlightOn){
            gameOver();
        }
        ghost.style.display = "none";
    }, 1500);
}

// flicker lights
function flicker(){
    roomDiv.style.filter = "brightness(0.05)";
    setTimeout(() => {
        roomDiv.style.filter = "brightness(0.2)";
    }, 200);
}

// game over
function gameOver(){
    alive = false;
    text.innerHTML = "YOU DIED";
    ghost.style.display = "block";
    ghost.style.left = "40%";
    ghost.style.top = "30%";
}

// flashlight follow mouse
document.addEventListener("mousemove", e => {
    flashlight.style.left = (e.clientX - 125) + "px";
    flashlight.style.top = (e.clientY - 125) + "px";
});

// flashlight toggle (F key)
document.addEventListener("keydown", e => {
    if(e.key === "f"){
        flashlightOn = !flashlightOn;
        flashlight.style.display = flashlightOn ? "block" : "none";
    }
});

</script>

</body>
</html>
